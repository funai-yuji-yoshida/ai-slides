<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI知識スライド集</title>
<!-- 検索結果に出したくない場合は次の行のコメントを外す -->
<!-- <meta name="robots" content="noindex"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--surface:#FFFFFF;--ink:#1C2430;--sub:#5B6676;--indigo:#2B3A8C;--indigo-soft:#E3E7F6;--mark:#F2C230;--line:#D9DEE7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12151F;--surface:#1A1F2E;--ink:#E8EBF2;--sub:#9AA3B5;--indigo:#8C9BEA;--indigo-soft:#262E4C;--line:#2C3346}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:64px 24px 80px}
h1{font-size:clamp(30px,5vw,48px);font-weight:900;line-height:1.3;margin:0 0 12px}
.lead{color:var(--sub);font-size:clamp(16px,2vw,19px);margin:0 0 40px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filters button{font:inherit;font-size:14px;border:1px solid var(--indigo);color:var(--indigo);background:transparent;border-radius:20px;padding:4px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--indigo);color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list a{display:grid;grid-template-columns:1fr auto;gap:4px 24px;padding:22px 4px;color:inherit;text-decoration:none}
.list a:hover .t{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:4px}
.t{font-size:clamp(19px,2.4vw,24px);font-weight:700;line-height:1.4}
.d{grid-column:1;color:var(--sub);font-size:15px}
.meta{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:13px;color:var(--sub)}
.tags{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{font-size:12px;background:var(--indigo-soft);color:var(--indigo);border-radius:4px;padding:0 8px}
.msg{color:var(--sub)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (max-width:600px){.list a{grid-template-columns:1fr}.meta{grid-column:1;grid-row:auto;text-align:left}}
</style>
</head>
<body>
<main class="wrap">
  <h1>AI知識スライド集</h1>
  <p class="lead">AIを使う人から、AIにデータを食わせて仕事をさせる人へ。基礎知識をスライドで学べます。</p>
  <div class="filters" id="filters" aria-label="タグで絞り込む"></div>
  <ul class="list" id="list"><li class="msg">読み込み中…</li></ul>
</main>
<script>
(async function(){
  const list=document.getElementById('list'),fil=document.getElementById('filters');
  let items=[];
  try{const r=await fetch('slides.json',{cache:'no-store'});items=await r.json();}
  catch(e){list.innerHTML='<li class="msg">一覧を読み込めませんでした。公開URLから開いてください。</li>';return;}
  items.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(tag){
    const v=tag?items.filter(i=>(i.tags||[]).includes(tag)):items;
    list.innerHTML=v.length?v.map(i=>'<li><a href="'+esc(i.path)+'"><span class="t">'+esc(i.title)+'</span><span class="meta">更新 '+esc(i.updated)+'</span><span class="d">'+esc(i.description)+'</span><span class="tags">'+(i.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')+'</span></a></li>').join(''):'<li class="msg">該当するスライドはありません。</li>';
  }
  const tags=[...new Set(items.flatMap(i=>i.tags||[]))];
  if(tags.length>1){['すべて',...tags].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',i===0);
    b.onclick=()=>{fil.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render(i===0?null:t)};fil.appendChild(b);});}
  render(null);
})();
</script>
</body>
</html>
